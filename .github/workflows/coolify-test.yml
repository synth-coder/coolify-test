name: Coolify Relay Node (Test Ring)

"on":
  workflow_dispatch:
    inputs:
      cycle_count:
        description: 'Relay cycle counter'
        required: false
        default: '0'
        type: string
      retry_depth:
        description: 'Circuit breaker retry depth'
        required: false
        default: '0'
        type: string
      test_handover:
        description: 'Handover minutes (default 5m)'
        required: false
        default: '5'
        type: string

jobs:
  coolify-relay:
    name: Run Persistent Coolify Relay Node
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Orchestration Repository
        uses: actions/checkout@v4

      # =====================================================================
      # PHASE 1: PRE-WARMING & BASELINE HYDRATION
      # =====================================================================
      - name: Bootstrap System, Dependencies & Pre-Warm State
        id: prewarm
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
        run: |
          set -euo pipefail
          echo "=== PHASE 1: Pre-Warming System, Local Images & Baseline State ==="

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl jq rclone netcat-openbsd sqlite3 dnsutils ca-certificates openssh-server

          # Install cloudflared
          echo "Installing Cloudflare Tunnel client (cloudflared)..."
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared

          # Restore Rclone configuration
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_BASE64" ]; then
            echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            echo "Rclone credentials restored."
          fi

          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"

          # Baseline directory initialization
          sudo mkdir -p /data/coolify /var/lib/docker/volumes /etc/cloudflared

          # Non-destructive pre-warming extraction (direct stream without ls calls)
          rclone cat "${TARGET}/coolify_bundle.tar.gz" 2>/dev/null | sudo tar --numeric-owner -xpzf - -C /data/coolify 2>/dev/null || true
          rclone cat "${TARGET}/volumes_bundle.tar.gz" 2>/dev/null | sudo tar --numeric-owner -xpzf - -C /var/lib/docker/volumes 2>/dev/null || true

          # Pre-pull standard Coolify container images to eliminate takeover delay
          echo "Pre-pulling core Coolify container images..."
          sudo docker network create --attachable coolify 2>/dev/null || true
          sudo docker pull ghcr.io/coollabsio/coolify:latest || true
          sudo docker pull ghcr.io/coollabsio/coolify-helper:latest || true
          sudo docker pull traefik:v3.1 || sudo docker pull traefik:v3.0 || true
          sudo docker pull postgres:15-alpine || sudo docker pull postgres:16-alpine || true
          sudo docker pull redis:7-alpine || sudo docker pull redis:alpine || true

          # If this is a completely fresh first run without existing state, install Coolify baseline
          if [ ! -f "/data/coolify/source/docker-compose.yml" ]; then
            echo "No prior state found. Bootstrapping official Coolify environment..."
            curl -fsSL https://cdn.coollabs.io/coolify/install.sh | sudo bash -s -- -f || true

            if [ -f "/data/coolify/source/.env" ]; then
              sudo sed -i 's|^APP_URL=.*|APP_URL=https://coolify.justsawyou.cyou|g' /data/coolify/source/.env 2>/dev/null || true
              if ! grep -q 'APP_URL=' /data/coolify/source/.env; then
                echo "APP_URL=https://coolify.justsawyou.cyou" | sudo tee -a /data/coolify/source/.env >/dev/null
              fi
            fi

            echo "Awaiting Coolify container stack initialization..."
            for sec in {1..90}; do
              if sudo docker ps --format '{{.Names}}' | grep -q 'coolify'; then
                echo "Coolify containers successfully spun up!"
                break
              fi
              sleep 2
            done
          fi

          echo "Pre-warming completed successfully."

      # =====================================================================
      # PHASE 2 & 3: HANDSHAKE, RESTORATION & INGRESS TAKEOVER
      # =====================================================================
      - name: Handshake, State Hydration & Cloudflare Ingress Takeover
        env:
          PREV_PAT: ${{ secrets.PREV_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== PHASE 2 & 3: Handshake, State Hydration & Ingress Claim ==="

          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"

          # Check if this is an automated rotation cycle awaiting predecessor sync flag
          if [ "${{ github.event.inputs.cycle_count }}" != "0" ]; then
            echo "Awaiting predecessor delta synchronization lock..."
            FLAG_FOUND=false
            for sec in {1..60}; do
              if rclone cat "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
                echo "Predecessor sync_complete flag detected ($((sec * 3))s)."
                FLAG_FOUND=true
                break
              fi
              sleep 3
            done
            if [ "$FLAG_FOUND" != "true" ]; then
              echo "::warning::Sync complete flag was not found within 180s. Proceeding with latest state."
            fi
          fi

          # Incremental delta pull, permission normalization, SSH host injection, and DB restore
          chmod +x scripts/coolify/restore_delta.sh || true
          ./scripts/coolify/restore_delta.sh "$TARGET"

          # Clear handshake flag
          rclone delete "${TARGET}/control/sync_complete.flag" 2>/dev/null || true

          # Start Cloudflare Tunnel connector with token mode
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "Launching Cloudflare Tunnel with official edge token..."
            sudo cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
            sleep 6

            # Verify Coolify dashboard readiness on port 8000
            echo "Verifying Coolify dashboard responsiveness on port 8000..."
            COOLIFY_UP=false
            for chk in {1..60}; do
              if curl -fsS -o /dev/null --connect-timeout 2 http://localhost:8000; then
                echo "SUCCESS: Coolify dashboard is alive and responding on port 8000! ($((chk*2))s)"
                COOLIFY_UP=true
                break
              fi
              sleep 2
            done

            if [ "$COOLIFY_UP" != "true" ]; then
              echo "::warning::Coolify port 8000 not responding yet. Inspecting Docker containers:"
              sudo docker ps -a
            fi

            # Export diagnostic snapshot
            mkdir -p /tmp/diag
            {
              echo "=== DOCKER CONTAINERS ==="
              sudo docker ps -a
              echo "=== COOLIFY COMPOSE STATUS ==="
              (sudo docker compose --project-directory /data/coolify/source --env-file /data/coolify/source/.env -f /data/coolify/source/docker-compose.yml -f /data/coolify/source/docker-compose.prod.yml ps -a) 2>&1 || true
              echo "=== COOLIFY LOGS ==="
              sudo docker logs --tail 100 coolify 2>&1 || true
              echo "=== COOLIFY-DB LOGS ==="
              sudo docker logs --tail 50 coolify-db 2>&1 || true
              echo "=== CLOUDFLARED LOGS ==="
              cat /tmp/cloudflared.log 2>&1 || true
            } > /tmp/diag/diagnostics.txt
            rclone copyto /tmp/diag/diagnostics.txt "${TARGET}/diagnostics.txt" 2>/dev/null || true
          fi

          # Cancel predecessor runner run to release concurrency
          REPOS=(
            "silver-demon61/coolify-test"
            "synth-coder/coolify-test"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -ge 0 ] && [ -n "$PREV_PAT" ]; then
            PREV_INDEX=$(( (CURRENT_INDEX - 1 + ${#REPOS[@]}) % ${#REPOS[@]} ))
            PREV_REPO="${REPOS[$PREV_INDEX]}"
            echo "Checking predecessor repo: ${PREV_REPO}..."

            PREV_RUN_ID=$(GH_TOKEN="$PREV_PAT" gh run list --repo "$PREV_REPO" \
              --json databaseId,status -q '.[] | select(.status=="in_progress") | .databaseId' 2>/dev/null | head -n 1 || echo "")

            if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
              echo "Cancelling predecessor run #${PREV_RUN_ID} on ${PREV_REPO}..."
              GH_TOKEN="$PREV_PAT" gh run cancel "$PREV_RUN_ID" --repo "$PREV_REPO" 2>/dev/null || true
            fi
          fi

      # =====================================================================
      # PHASE 4: PRODUCTION SHIFT & WATCHDOG
      # =====================================================================
      - name: Production Shift & Successor Handover Dispatch
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          set -euo pipefail
          echo "=== PHASE 4: Shift Active ==="
          HANDOVER_MINUTE=5
          if [ -n "$TEST_HANDOVER" ] && [ "$TEST_HANDOVER" -gt 0 ] 2>/dev/null; then
            HANDOVER_MINUTE=$TEST_HANDOVER
          fi

          echo "Target shift duration: ${HANDOVER_MINUTE} minute(s)"
          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"
          ELAPSED=0

          while [ $ELAPSED -lt $HANDOVER_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))
            echo "[$(date +'%T')] Shift Progress: ${ELAPSED}/${HANDOVER_MINUTE}m"

            # Check health
            if ! curl -fsS --connect-timeout 2 http://localhost:8000 >/dev/null 2>&1; then
              echo "[$(date +'%T')] Warning: Local Coolify dashboard unreachable at minute ${ELAPSED}. Recovering stack..."
              (cd /data/coolify/source && sudo docker network create --attachable coolify 2>/dev/null || true)
              (cd /data/coolify/source && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d 2>&1 || true)
            fi
          done

          echo "=== HANDOVER THRESHOLD REACHED (Minute ${HANDOVER_MINUTE}) ==="

          # 1. Take atomic database dump & delta sync BEFORE triggering successor!
          echo "Executing Final Freeze & Delta Sync to B2..."
          chmod +x scripts/coolify/sync_delta.sh || true
          ./scripts/coolify/sync_delta.sh "$TARGET" || true

          # 2. Release Cloudflare Tunnel connector
          echo "Releasing Cloudflare Tunnel connector..."
          sudo pkill -SIGTERM cloudflared 2>/dev/null || true

          # 3. Mark delta sync complete flag in B2
          rclone touch "${TARGET}/control/sync_complete.flag" 2>/dev/null || true

          REPOS=(
            "silver-demon61/coolify-test"
            "synth-coder/coolify-test"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          NEXT_CYCLE=$((CYCLE_COUNT + 1))

          echo "Dispatching successor runner to ${PRIMARY_TARGET}..."
          GH_TOKEN="$NEXT_PAT" gh workflow run coolify-test.yml \
            --repo "$PRIMARY_TARGET" \
            --ref main \
            -f cycle_count="$NEXT_CYCLE" \
            -f retry_depth="0" \
            -f test_handover="${HANDOVER_MINUTE}" || echo "Warning: Dispatch returned non-zero"

          # 4. Await successor acknowledgement
          echo "Handshake flag set. Awaiting successor takeover..."
          for check in {1..60}; do
            if ! rclone cat "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
              echo "Successor has claimed the delta flag! Exiting gracefully..."
              break
            fi
            sleep 5
          done

          echo "Handover complete! Outgoing node entering standby (max 1m)..."
          sleep 60
          exit 0

      # =====================================================================
      # PHASE 5: TEARDOWN
      # =====================================================================
      - name: Final Teardown Safety Check
        if: always()
        env:
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
        run: |
          echo "=== PHASE 5: Teardown & Clean Exit ==="
          sudo pkill -SIGTERM cloudflared 2>/dev/null || true
          TARGET="${STORAGE_TARGET:-b2:coolify-relay-state/coolify-state}"
          if sudo docker ps --format '{{.Names}}' 2>/dev/null | grep -q 'coolify-db'; then
            echo "[TEARDOWN] Safety dump of PostgreSQL to B2..."
            sudo docker exec coolify-db pg_dumpall -U coolify --clean 2>/dev/null | gzip | rclone rcat "${TARGET}/coolify_pg_latest.sql.gz" 2>/dev/null || true
          fi
          (cd /data/coolify/source 2>/dev/null && sudo docker compose down -t 2) || true
          echo "Node shutdown clean."
